<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Leo Finance</title>
<script>try{var _t=localStorage.getItem('leofin-theme');if(_t&&_t!=='day')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<style>
/* ============================================================
   Leo Finance — single-file PWA
   Theme tokens: day (no attr) / sepia / dark / night on <html data-theme>
   ============================================================ */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --panel-2:#eef2f0;
  --text:#18201d; --text-soft:#5a635e; --text-faint:#8b938d;
  --border:#dde2df; --border-strong:#c9d0cb;
  --accent:#1f7a54; --accent-soft:#e2f0ea; --on-accent:#ffffff;
  --pos:#1f7a54; --pos-soft:#e2f0ea;
  --neg:#b0472e; --neg-soft:#f3e5e0;
  --neu:#5a6b8a; --neu-soft:#e7ebf2;
  --warn:#b07d1f;
  --shadow:0 1px 3px rgba(20,30,25,.10), 0 1px 2px rgba(20,30,25,.06);
  --radius:12px; --radius-sm:8px;
  --tab-h:64px;
}
:root[data-theme="sepia"]{
  --bg:#ece3d2; --panel:#f6efe0; --panel-2:#eadfc7;
  --text:#3a3226; --text-soft:#6b5f4c; --text-faint:#96876c;
  --border:#dccfb2; --border-strong:#cbb98f;
  --accent:#1f7a54; --accent-soft:#dfece0; --on-accent:#ffffff;
  --pos:#2f6b4a; --pos-soft:#dfece0;
  --neg:#a5482f; --neg-soft:#eaddcf;
  --neu:#5f6070; --neu-soft:#e6e2d6;
  --shadow:0 1px 3px rgba(80,60,30,.14);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614; --panel:#1a201d; --panel-2:#202723;
  --text:#e2e6e1; --text-soft:#a4aba4; --text-faint:#727a73;
  --border:#2a322d; --border-strong:#3a433d;
  --accent:#58b48d; --accent-soft:#1d2b25; --on-accent:#0d1310;
  --pos:#58b48d; --pos-soft:#1d2b25;
  --neg:#da7a5f; --neg-soft:#2d211c;
  --neu:#8fa0c0; --neu-soft:#1e2530;
  --warn:#d9a441;
  --shadow:0 1px 3px rgba(0,0,0,.45);
}
:root[data-theme="night"]{
  color-scheme:dark;
  --bg:#0f0d0b; --panel:#17140f; --panel-2:#1e1a13;
  --text:#c9b89c; --text-soft:#8f8069; --text-faint:#6b5f4c;
  --border:#2a251d; --border-strong:#3a3428;
  --accent:#c7a86a; --accent-soft:#211c12; --on-accent:#17140f;
  --pos:#a8b56a; --pos-soft:#1c1f12;
  --neg:#c77f5f; --neg-soft:#211812;
  --neu:#9a8f70; --neu-soft:#1d1913;
  --warn:#c7a86a;
  --shadow:0 1px 3px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:520px; margin:0 auto; min-height:100vh;
  background:var(--bg);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
  position:relative;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em;}
button{font:inherit; cursor:pointer;}
a{color:var(--accent);}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.topbar .brand{display:flex; align-items:baseline; gap:8px;}
.topbar .brand b{font-size:1.15rem; letter-spacing:-.02em;}
.topbar .brand span{font-size:.72rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em;}
.iconbtn{
  border:1px solid var(--border); background:var(--panel);
  color:var(--text-soft); width:38px; height:38px; border-radius:10px;
  display:grid; place-items:center; font-size:1.05rem;
}
.iconbtn:active{transform:scale(.94);}

/* ---------- view container ---------- */
main{padding:16px;}
.view-title{font-size:1.35rem; margin-bottom:2px;}
.view-sub{color:var(--text-soft); font-size:.85rem; margin-bottom:16px;}

/* ---------- cards ---------- */
.card{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; margin-bottom:14px;
}
.card.tight{padding:12px 14px;}
.card h3{font-size:.95rem;}
.section-label{
  font-size:.72rem; text-transform:uppercase; letter-spacing:.11em;
  color:var(--text-faint); margin:22px 4px 8px;
}
.section-label:first-child{margin-top:4px;}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px;}
.tile{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow);
}
.tile .t-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);}
.tile .t-val{font-size:1.3rem; font-weight:700; margin-top:6px; letter-spacing:-.02em;}
.tile .t-val.sm{font-size:1.08rem;}
.tile .t-note{font-size:.72rem; color:var(--text-soft); margin-top:3px;}
.pos{color:var(--pos);} .neg{color:var(--neg);} .neu{color:var(--neu);} .faint{color:var(--text-faint);}

/* ---------- list rows ---------- */
.row{
  display:flex; align-items:center; gap:12px;
  padding:11px 4px; border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:0;}
.row .ic{
  width:36px; height:36px; border-radius:10px; flex:none;
  display:grid; place-items:center; font-size:1.05rem;
  background:var(--panel-2);
}
.row .rmain{flex:1; min-width:0;}
.row .rtitle{font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .rsub{font-size:.78rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .ramt{font-weight:650; text-align:right; white-space:nowrap;}
.row .ramt small{display:block; font-weight:400; font-size:.72rem; color:var(--text-faint);}
.row.tappable:active{background:var(--panel-2);}

.empty{
  text-align:center; color:var(--text-faint); font-size:.9rem;
  padding:26px 12px;
}
.empty .big{font-size:1.7rem; display:block; margin-bottom:6px; opacity:.7;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--border-strong); background:var(--panel); color:var(--text);
  padding:10px 15px; border-radius:10px; font-weight:600; font-size:.9rem;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent); padding-left:6px; padding-right:6px;}
.btn.wide{width:100%;}
.btn.sm{padding:7px 11px; font-size:.82rem;}
.btn.danger{color:var(--neg); border-color:var(--neg-soft);}
.btnrow{display:flex; gap:10px; flex-wrap:wrap;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:520px; margin:0 auto;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--panel); border-top:1px solid var(--border);
  display:grid; grid-template-columns:repeat(5,1fr); align-items:center;
}
.tabbar button{
  border:0; background:none; color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:.66rem; font-weight:600; letter-spacing:.02em; padding:6px 0;
  height:100%;
}
.tabbar button .ti{font-size:1.15rem; line-height:1;}
.tabbar button.active{color:var(--accent);}
.tabbar button.add .ti{
  background:var(--accent); color:var(--on-accent);
  width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  font-size:1.5rem; margin-top:-18px; box-shadow:var(--shadow);
  border:3px solid var(--panel);
}
.tabbar button.add{color:var(--accent);}

/* ---------- modal / sheet ---------- */
.scrim{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.42);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.scrim.open{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--panel); width:100%; max-width:520px;
  border-radius:18px 18px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);
  max-height:92vh; overflow-y:auto;
  transform:translateY(14px); transition:transform .18s ease;
}
.scrim.open .sheet{transform:translateY(0);}
.sheet .grab{width:38px; height:4px; border-radius:3px; background:var(--border-strong); margin:0 auto 14px;}
.sheet h2{font-size:1.1rem; margin-bottom:14px;}

/* ---------- form fields ---------- */
label.fld{display:block; margin-bottom:12px;}
label.fld .lbl{font-size:.76rem; color:var(--text-soft); font-weight:600; margin-bottom:5px; display:block;}
input,select,textarea{
  width:100%; font:inherit; color:var(--text);
  background:var(--bg); border:1px solid var(--border-strong); border-radius:10px;
  padding:11px 12px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.amount-input{font-size:1.6rem; font-weight:700; text-align:right; letter-spacing:-.02em;}
textarea{min-height:52px; resize:vertical;}

.seg{display:flex; gap:6px; background:var(--panel-2); padding:4px; border-radius:12px;}
.seg button{
  flex:1; border:0; background:none; color:var(--text-soft);
  padding:9px 4px; border-radius:9px; font-weight:650; font-size:.86rem;
}
.seg button.on{background:var(--panel); color:var(--text); box-shadow:var(--shadow);}
.seg.kind button.on[data-k="income"]{color:var(--pos);}
.seg.kind button.on[data-k="expense"]{color:var(--neg);}

.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{
  border:1px solid var(--border-strong); background:var(--panel);
  padding:7px 11px; border-radius:20px; font-size:.82rem; font-weight:600; color:var(--text-soft);
  display:inline-flex; align-items:center; gap:5px;
}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.chip .cx{font-size:.95rem;}

.catgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:2px;}
.catgrid button{
  border:1px solid var(--border); background:var(--panel);
  border-radius:10px; padding:9px 4px 7px; display:flex; flex-direction:column;
  align-items:center; gap:4px; color:var(--text-soft); font-size:.68rem; font-weight:600;
  text-align:center; line-height:1.15;
}
.catgrid button .ce{font-size:1.25rem;}
.catgrid button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}

/* ---------- donut + bars ---------- */
.donut-wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.donut{
  width:128px; height:128px; border-radius:50%; flex:none;
  -webkit-mask:radial-gradient(circle 40px at 50% 50%, transparent 98%, #000 100%);
          mask:radial-gradient(circle 40px at 50% 50%, transparent 98%, #000 100%);
  position:relative;
}
.donut .center{position:absolute; inset:0; display:grid; place-items:center;}
.legend{flex:1; min-width:150px; display:flex; flex-direction:column; gap:7px;}
.legend .lg{display:flex; align-items:center; gap:8px; font-size:.82rem;}
.legend .sw{width:10px; height:10px; border-radius:3px; flex:none;}
.legend .lg b{margin-left:auto; font-variant-numeric:tabular-nums;}
.legend .lg .pc{color:var(--text-faint); width:38px; text-align:right; font-variant-numeric:tabular-nums;}

.bars{display:flex; align-items:flex-end; gap:3px; height:96px; margin-top:6px;}
.bars .b{flex:1; background:var(--accent-soft); border-radius:3px 3px 0 0; min-height:2px; position:relative;}
.bars .b.today{background:var(--accent);}
.bars-x{display:flex; justify-content:space-between; font-size:.64rem; color:var(--text-faint); margin-top:4px;}

.nws{display:flex; height:26px; border-radius:7px; overflow:hidden; border:1px solid var(--border);}
.nws span{display:block;}
.nws-key{display:flex; gap:14px; margin-top:8px; font-size:.76rem; color:var(--text-soft); flex-wrap:wrap;}
.nws-key i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px;}

/* ---------- misc ---------- */
.inline-add{display:flex; gap:8px; margin-top:10px;}
.inline-add input{flex:1;}
.hintline{font-size:.76rem; color:var(--text-faint); margin-top:8px;}
.divider{height:1px; background:var(--border); margin:14px 0;}
.badge{
  font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:6px;
  background:var(--panel-2); color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em;
}
.badge.pos{background:var(--pos-soft); color:var(--pos);}
.badge.neg{background:var(--neg-soft); color:var(--neg);}
.toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + 20px); transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px;
  font-size:.85rem; font-weight:600; z-index:60; opacity:0; transition:all .2s ease;
  display:flex; align-items:center; gap:12px; max-width:90%;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast button{background:none; border:0; color:var(--accent); font-weight:700;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><b>Leo&nbsp;Finance</b><span id="periodLabel"></span></div>
    <button class="iconbtn" id="btnSettings" aria-label="Settings">&#9881;</button>
  </div>
  <main id="view"><!-- rendered --></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="active"><span class="ti">&#8962;</span>Home</button>
  <button data-tab="money"><span class="ti">&#9783;</span>Money</button>
  <button data-tab="add" class="add" aria-label="Add transaction"><span class="ti">+</span></button>
  <button data-tab="people"><span class="ti">&#128101;</span>People</button>
  <button data-tab="reports"><span class="ti">&#128202;</span>Reports</button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. Utilities
   ============================================================ */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const todayISO = ()=> new Date().toLocaleDateString('en-CA'); // yyyy-mm-dd local
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const nfFull = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2});
const nfRound = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const money  = p => nfFull.format((p||0)/100);
const moneyR = p => nfRound.format(Math.round((p||0)/100));
function parseAmount(s){
  if(typeof s === 'number') return Math.round(s*100);
  s = (s||'').toString().replace(/[₹,\s]/g,'').trim();
  if(!s) return 0;
  const v = parseFloat(s);
  return isNaN(v) ? 0 : Math.round(v*100);
}
function fmtDay(iso){
  const d = new Date(iso+'T00:00:00');
  const t = todayISO();
  if(iso===t) return 'Today';
  const y = new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(iso===y) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function periodBounds(startDay, ref){
  const d = ref ? new Date(ref+'T00:00:00') : new Date();
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate() < startDay){ m-=1; if(m<0){m=11;y-=1;} }
  return { start:new Date(y,m,startDay), end:new Date(y,m+1,startDay) };
}
const inRange = (iso,b)=>{ const t=new Date(iso+'T00:00:00'); return t>=b.start && t<b.end; };
function toast(msg, actionLabel, actionFn){
  const el = $('#toast');
  el.innerHTML = esc(msg) + (actionLabel ? ` <button id="toastAct">${esc(actionLabel)}</button>` : '');
  el.classList.add('show');
  if(actionLabel){ $('#toastAct').onclick = ()=>{ actionFn&&actionFn(); el.classList.remove('show'); }; }
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), actionLabel ? 5200 : 2400);
}

/* ============================================================
   1. IndexedDB layer
   ============================================================ */
const DB_NAME='leo-finance', DB_VER=3;
const STORES=['accounts','categories','transactions','holdings','loans','loanEntries','fixedAssets','recurring',
              'creditCards','cardStatements','goals','valuations','assetTypes'];
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e=>{
      const db = rq.result;
      STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'k'});
    };
    rq.onsuccess = ()=>{ _db=rq.result; res(_db); };
    rq.onerror = ()=>rej(rq.error);
  });
}
function tx(store, mode='readonly'){ return _db.transaction(store, mode).objectStore(store); }
const idbGetAll = store => new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
const idbPut    = (store,obj) => new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
const idbDel    = (store,id) => new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
const metaGet   = k => new Promise((res,rej)=>{ const r=_db.transaction('meta').objectStore('meta').get(k); r.onsuccess=()=>res(r.result?r.result.v:undefined); r.onerror=()=>rej(r.error); });
const metaPut   = (k,v) => new Promise((res,rej)=>{ const r=_db.transaction('meta','readwrite').objectStore('meta').put({k,v}); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });

/* ============================================================
   2. In-memory cache + store helpers
   ============================================================ */
const cache = { accounts:[], categories:[], transactions:[], holdings:[], loans:[], loanEntries:[], fixedAssets:[], recurring:[],
                creditCards:[], cardStatements:[], goals:[], valuations:[], assetTypes:[] };
let settings = { monthStartDay:1, theme:'day', locale:'en-IN' };

async function reloadCache(){
  for(const s of STORES) cache[s] = await idbGetAll(s);
  const st = await metaGet('settings'); if(st) settings = Object.assign(settings, st);
  cache.transactions.sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  cache.accounts.sort((a,b)=> (a.order||0)-(b.order||0));
  cache.categories.sort((a,b)=> (a.order||0)-(b.order||0));
  cache.creditCards.sort((a,b)=> (a.order||0)-(b.order||0));
  cache.assetTypes.sort((a,b)=> (a.order||0)-(b.order||0));
}
async function saveSettings(patch){ settings = Object.assign(settings, patch); await metaPut('settings', settings); }

const catById  = id => cache.categories.find(c=>c.id===id);
const accById  = id => cache.accounts.find(a=>a.id===id);
const loanById = id => cache.loans.find(l=>l.id===id);
const cardById = id => cache.creditCards.find(c=>c.id===id);
const goalById = id => cache.goals.find(g=>g.id===id);
const holdingType = h => cache.assetTypes.find(t=>t.id===h.assetTypeId) || cache.assetTypes.find(t=>t.name===h.typeName) || cache.assetTypes[0] || {name:h.typeName||'Asset',icon:'📦',quantityUnit:'',fields:[]};

/* nodeName: resolve a from/to id to a display label (account, card, loan, holding, or literal) */
function nodeName(id){
  if(!id) return '';
  const a = accById(id); if(a) return a.name;
  const c = cardById(id); if(c) return c.name;
  const l = loanById(id); if(l) return (l.direction==='lent'?'Loan · ':'Debt · ')+l.person;
  const h = cache.holdings.find(x=>x.id===id); if(h) return h.label;
  return '';
}

/* ---- balances ---- */
function accountBalance(accId){
  const a = accById(accId); if(!a) return 0;
  let bal = a.openingBalance||0;
  for(const t of cache.transactions){
    if(t.toId===accId)   bal += t.amount;
    if(t.fromId===accId) bal -= t.amount;
  }
  return bal;
}
const liquidCash = ()=> cache.accounts.filter(a=>!a.archived).reduce((s,a)=>s+accountBalance(a.id),0);

function loanOutstanding(loanId){
  const l = loanById(loanId); if(!l) return 0;
  let paid = 0;
  for(const e of cache.loanEntries){ if(e.loanId===loanId && e.kind==='repay') paid += e.amount; }
  return Math.max(0, (l.principal||0) - paid);
}
const totalLent   = ()=> cache.loans.filter(l=>l.direction==='lent'    && l.status!=='settled').reduce((s,l)=>s+loanOutstanding(l.id),0);
const totalOwed   = ()=> cache.loans.filter(l=>l.direction==='borrowed'&& l.status!=='settled').reduce((s,l)=>s+loanOutstanding(l.id),0);
const holdingsCur = ()=> cache.holdings.reduce((s,h)=>s+(h.currentValue||0),0);
const holdingsInv = ()=> cache.holdings.reduce((s,h)=>s+(h.investedValue||0),0);

/* credit card outstanding = spends charged to it − payments made to it */
function cardOutstanding(cardId){
  let bal = 0;
  for(const t of cache.transactions){
    if(t.fromId===cardId) bal += t.amount;   // a spend on the card
    if(t.toId===cardId)   bal -= t.amount;   // a payment toward the card
  }
  return Math.max(0, bal);
}
const totalCardDebt = ()=> cache.creditCards.filter(c=>!c.archived).reduce((s,c)=>s+cardOutstanding(c.id),0);
const latestStatement = cardId => cache.cardStatements
  .filter(s=>s.cardId===cardId).sort((a,b)=>(b.statementDate||'').localeCompare(a.statementDate||''))[0];

function netWorthParts(){
  const cash=liquidCash(), hold=holdingsCur(), lent=totalLent();
  const assets = cash + hold + lent;
  const cards = totalCardDebt();
  const people = totalOwed();
  const liab = cards + people;
  return { cash, hold, lent, assets, cards, people, liab, net: assets - liab };
}

/* ---- period sums ---- */
function periodTxns(ref){
  const b = periodBounds(settings.monthStartDay, ref);
  return cache.transactions.filter(t=>inRange(t.date,b));
}
const sumKind = (txns,kind)=> txns.filter(t=>t.kind===kind).reduce((s,t)=>s+t.amount,0);

/* ---- recurring ---- */
function advanceDate(iso, freq){
  const d = new Date(iso+'T00:00:00');
  if(freq==='weekly'){ d.setDate(d.getDate()+7); }
  else { const day=d.getDate(); d.setMonth(d.getMonth()+1); if(d.getDate()<day) d.setDate(0); }
  return d.toLocaleDateString('en-CA');
}
function txFromRecurring(r, dateISO){
  return { id:uid(), amount:r.amount, kind:r.kind, fromId:r.fromId||null, toId:r.toId||null,
    categoryId:r.categoryId, date:dateISO||todayISO(), note:r.name, tags:['recurring'], recurringId:r.id, createdAt:new Date().toISOString() };
}
/* auto-post everything due for autoPost recurrings; returns list still pending (manual) */
async function processRecurring(){
  const today = todayISO();
  let posted = false;
  for(const r of cache.recurring){
    if(!r.autoPost) continue;
    let guard = 0;
    while(r.nextDueDate && r.nextDueDate <= today && guard++ < 60){
      await idbPut('transactions', txFromRecurring(r, r.nextDueDate));
      r.nextDueDate = advanceDate(r.nextDueDate, r.frequency);
      await idbPut('recurring', r);
      posted = true;
    }
  }
  if(posted) await reloadCache();
}
const pendingRecurring = ()=> cache.recurring.filter(r=>!r.autoPost && r.nextDueDate && r.nextDueDate <= todayISO());

function periodRangeText(){

  else sub = esc(nodeName(t.kind==='income'?t.toId:t.fromId) || c.name);

  return `<div class="row tappable" data-tx="${t.id}">

}

/* ---------- REPORTS ---------- */
function renderReports(){
  const P = periodTxns();
  const exp = P.filter(t=>t.kind==='expense');
  const total = exp.reduce((s,t)=>s+t.amount,0);
  const b = periodBounds(settings.monthStartDay);
  const daysElapsed = Math.max(1, Math.ceil((Date.now()-b.start.getTime())/864e5));
  const daysInPeriod = Math.round((b.end-b.start)/864e5);
  const avg = total/daysElapsed;
  const projected = avg*daysInPeriod;

  // last period comparison
  const prevRef = new Date(b.start.getTime()-864e5).toLocaleDateString('en-CA');
  const prevTotal = periodTxns(prevRef).filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0);
  const delta = prevTotal? Math.round((total-prevTotal)/prevTotal*100) : 0;

  // by category
  const byCat = {}, byCatN = {};
  exp.forEach(t=>{ byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount; byCatN[t.categoryId]=(byCatN[t.categoryId]||0)+1; });
  const cats = Object.entries(byCat).map(([id,amt])=>({c:catById(id)||{name:'Uncategorised',color:'#8b938d',icon:'•'},amt,n:byCatN[id]||0}))
                 .sort((a,b)=>b.amt-a.amt);
  let acc=0; const stops = cats.map(x=>{ const from=acc/total*360; acc+=x.amt; const to=acc/total*360; return `${x.c.color} ${from}deg ${to}deg`; });
  const donutBG = total>0 ? `conic-gradient(${stops.join(',')})` : 'var(--panel-2)';

  // needs/wants/savings
  const cls = {need:0,want:0,saving:0,debt:0,na:0};
  P.filter(t=>t.kind!=='income').forEach(t=>{ const c=catById(t.categoryId); if(c) cls[c.class]=(cls[c.class]||0)+t.amount; });
  const clsTotal = Object.values(cls).reduce((a,b)=>a+b,0)||1;
  const clsColor = {need:'var(--pos)',want:'var(--neg)',saving:'var(--neu)',debt:'var(--warn)',na:'var(--border-strong)'};

  // daily bars + calendar heatmap
  const dayMap = {};
  exp.forEach(t=>{ dayMap[t.date]=(dayMap[t.date]||0)+t.amount; });
  const days=[]; for(let d=new Date(b.start); d<b.end && d<=new Date(); d.setDate(d.getDate()+1)){ const iso=d.toLocaleDateString('en-CA'); days.push([iso, dayMap[iso]||0]); }
  const maxDay = Math.max(1, ...days.map(d=>d[1]));

  // full calendar grid for the period (Sun-first weeks)
  const calCells=[]; { const first=new Date(b.start); const lead=first.getDay();
    for(let i=0;i<lead;i++) calCells.push(null);
    for(let d=new Date(b.start); d<b.end; d.setDate(d.getDate()+1)){ const iso=d.toLocaleDateString('en-CA'); calCells.push([iso, dayMap[iso]||0, d.getDate()]); } }
  const calMax = Math.max(1, ...calCells.filter(Boolean).map(c=>c[1]));

  // 6-month comparison (period totals)
  const months=[]; let ref=todayISO();
  for(let i=0;i<6;i++){
    const mb = periodBounds(settings.monthStartDay, ref);
    const mt = cache.transactions.filter(t=>t.kind==='expense' && inRange(t.date,mb)).reduce((s,t)=>s+t.amount,0);
    months.unshift([mb.start.toLocaleDateString('en-IN',{month:'short'}), mt, i===0]);
    ref = new Date(mb.start.getTime()-864e5).toLocaleDateString('en-CA');
  }
  const monthsMax = Math.max(1, ...months.map(m=>m[1]));

  // budgets
  const budgets = cache.categories.filter(c=>c.monthlyBudget>0).map(c=>({c, spent: byCat[c.id]||0}))
                    .sort((a,b)=> (b.spent/b.c.monthlyBudget) - (a.spent/a.c.monthlyBudget));

  view.innerHTML = `
    <div class="view-title">Reports</div>
    <div class="view-sub">${esc(periodRangeText())}</div>

    <div class="tiles">
      <div class="tile"><div class="t-label">Spent</div><div class="t-val neg sm tnum">${moneyR(total)}</div>
        <div class="t-note">${prevTotal? (delta>=0?'▲ ':'▼ ')+Math.abs(delta)+'% vs last' : 'no prior period'}</div></div>
      <div class="tile"><div class="t-label">Daily average</div><div class="t-val sm tnum">${moneyR(avg)}</div>
        <div class="t-note">projected ${moneyR(projected)}</div></div>
    </div>

    <div class="section-label">Where it went</div>
    <div class="card">
      ${total>0 ? `<div class="donut-wrap">
        <div class="donut" style="background:${donutBG}"><div class="center"><div style="text-align:center"><div class="faint" style="font-size:.62rem;text-transform:uppercase;letter-spacing:.08em">Total</div><b class="tnum" style="font-size:.9rem">${moneyR(total)}</b></div></div></div>
        <div class="legend">${cats.slice(0,7).map(x=>`<div class="lg"><span class="sw" style="background:${x.c.color}"></span>${esc(x.c.name)}<span class="pc">${Math.round(x.amt/total*100)}%</span><b class="tnum">${moneyR(x.amt)}</b></div>`).join('')}</div>
      </div>` : `<div class="empty"><span class="big">📊</span>No expenses in this period yet</div>`}
    </div>

    ${total>0?`<div class="section-label">Needs · Wants · Savings</div>
    <div class="card">
      <div class="nws">
        ${['need','want','saving','debt','na'].map(k=> cls[k]>0? `<span style="width:${cls[k]/clsTotal*100}%;background:${clsColor[k]}"></span>`:'').join('')}
      </div>
      <div class="nws-key">
        <span><i style="background:var(--pos)"></i>Needs ${Math.round(cls.need/clsTotal*100)}%</span>
        <span><i style="background:var(--neg)"></i>Wants ${Math.round(cls.want/clsTotal*100)}%</span>
        <span><i style="background:var(--neu)"></i>Savings ${Math.round(cls.saving/clsTotal*100)}%</span>
        ${cls.debt>0?`<span><i style="background:var(--warn)"></i>Debt ${Math.round(cls.debt/clsTotal*100)}%</span>`:''}
      </div>
    </div>`:''}

    ${budgets.length?`<div class="section-label">Budgets</div>
    <div class="card tight">
      ${budgets.map(({c,spent})=>{ const pct=Math.round(spent/c.monthlyBudget*100); const over=spent>c.monthlyBudget;
        return `<div class="row" style="flex-wrap:wrap" data-catdrill="${c.id}">
          <div class="ic" style="background:${c.color}22">${c.icon}</div>
          <div class="rmain"><div class="rtitle">${esc(c.name)}</div>
            <div class="rsub">${moneyR(spent)} of ${moneyR(c.monthlyBudget)}${over?' · over by '+moneyR(spent-c.monthlyBudget):''}</div></div>
          <div class="ramt tnum ${over?'neg':''}">${pct}%</div>
          <div style="flex-basis:100%;height:6px;background:var(--panel-2);border-radius:4px;margin-top:6px">
            <div style="width:${Math.min(100,pct)}%;height:100%;background:${over?'var(--neg)':'var(--accent)'};border-radius:4px"></div></div>
        </div>`; }).join('')}
    </div>`:''}

    ${total>0?`<div class="section-label">Daily spend</div>
    <div class="card">
      <div class="bars">${days.map(([iso,v])=>`<div class="b ${iso===todayISO()?'today':''}" style="height:${Math.max(2,Math.round(v/maxDay*96))}px" title="${fmtDay(iso)} ${money(v)}"></div>`).join('')}</div>
      <div class="bars-x"><span>${days.length?fmtDay(days[0][0]):''}</span><span>${days.length?fmtDay(days[days.length-1][0]):''}</span></div>
    </div>

    <div class="section-label">Calendar</div>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="faint" style="text-align:center;font-size:.62rem">${d}</div>`).join('')}
        ${calCells.map(cell=> cell===null ? `<div></div>` : (()=>{ const [iso,v,dn]=cell; const int=v/calMax;
          const bg = v>0 ? `color-mix(in srgb, var(--accent) ${Math.round(20+int*80)}%, var(--panel-2))` : 'var(--panel-2)';
          return `<div ${v>0?`class="calday" data-calday="${iso}"`:''} style="aspect-ratio:1;border-radius:5px;background:${bg};display:grid;place-items:center;font-size:.6rem;color:${int>.5?'var(--on-accent)':'var(--text-faint)'}" title="${fmtDay(iso)} ${money(v)}">${dn}</div>`; })()).join('')}
      </div>
    </div>

    <div class="section-label">Last 6 months</div>
    <div class="card">
      <div class="bars" style="height:80px">${months.map(([lbl,v,cur])=>`<div class="b ${cur?'today':''}" style="height:${Math.max(2,Math.round(v/monthsMax*80))}px" title="${lbl} ${money(v)}"></div>`).join('')}</div>
      <div class="bars-x">${months.map(([lbl])=>`<span>${lbl}</span>`).join('')}</div>
    </div>`:''}

    <div class="section-label">By category</div>
    <div class="card tight">
      ${cats.length? cats.map(x=>`<div class="row tappable" data-catdrill="${x.c.id||''}">
        <div class="ic" style="background:${x.c.color}22">${x.c.icon}</div>
        <div class="rmain"><div class="rtitle">${esc(x.c.name)}</div><div class="rsub">${x.n} txn${x.n===1?'':'s'}</div></div>
        <div class="ramt tnum">${money(x.amt)}</div>
      </div>`).join('') : `<div class="empty">—</div>`}
    </div>
  `;
  $$('[data-catdrill]').forEach(r=> r.onclick = ()=> openCatDrill(r.dataset.catdrill));
  $$('[data-calday]').forEach(r=> r.onclick = ()=> openDayDrill(r.dataset.calday));
}
function openDayDrill(iso){
  const list = cache.transactions.filter(t=>t.date===iso).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  openSheet(`<h2>${fmtDay(iso)}</h2>
    <div class="view-sub">${list.length} transactions · spent ${money(list.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0))}</div>
    <div class="card tight">${list.map(txRow).join('')||'<div class="empty">None</div>'}</div>`);
  wireTxRows();
}
function openCatDrill(catId){
  const c = catById(catId)||{name:'—'};
  const list = periodTxns().filter(t=>t.categoryId===catId).sort((a,b)=>b.date.localeCompare(a.date));
  openSheet(`<h2>${esc(c.icon||'')} ${esc(c.name)}</h2>
    <div class="view-sub">${list.length} transactions · ${money(list.reduce((s,t)=>s+t.amount,0))}</div>
    <div class="card tight">${list.map(txRow).join('')||'<div class="empty">None</div>'}</div>`);
  wireTxRows();
}

/* ============================================================
   5. Sheets — Add transaction
   ============================================================ */
function openSheet(html){
  $('#sheet').innerHTML = `<div class="grab"></div>` + html;
  $('#scrim').classList.add('open');
}
function closeSheet(){ $('#scrim').classList.remove('open'); }
$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') closeSheet(); });

let addDraft = null;
function openAddSheet(seed){
  const editing = seed && seed.id;
  addDraft = Object.assign({ id:uid(), kind:'expense', amount:0, fromId:null, toId:null, categoryId:null, date:todayISO(), note:'', tags:[], createdAt:new Date().toISOString() }, seed||{});
  // default account = last used
  if(!editing){
    const last = cache.transactions[0];
    if(addDraft.kind==='expense' && !addDraft.fromId) addDraft.fromId = (last && last.fromId) || (cache.accounts[0]&&cache.accounts[0].id);
    if(addDraft.kind==='income'  && !addDraft.toId)   addDraft.toId   = (last && last.toId) || (cache.accounts[0]&&cache.accounts[0].id);
  }
  drawAddSheet(editing);
}
function drawAddSheet(editing){
  const d = addDraft;
  const accOpts = (sel,withCards) => {
    let o = cache.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} · ${money(accountBalance(a.id))}</option>`).join('');
    if(withCards && cache.creditCards.filter(c=>!c.archived).length)
      o += `<optgroup label="Credit cards">` + cache.creditCards.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · owe ${money(cardOutstanding(c.id))}</option>`).join('') + `</optgroup>`;
    return o;
  };
  const cats = cache.categories.filter(c=> d.kind==='transfer' ? (c.kind==='transfer') : c.kind===d.kind || (d.kind==='expense'&&c.kind==='transfer'&&c.class==='debt'));
  const favs = cats.filter(c=>c.isFavourite);

  openSheet(`
    <h2>${editing?'Edit':'Add'} ${d.kind}</h2>
    <div class="seg kind" id="segKind">
      ${['expense','income','transfer'].map(k=>`<button data-k="${k}" class="${d.kind===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}
    </div>

    <label class="fld" style="margin-top:14px">
      <span class="lbl">Amount (₹)</span>
      <input id="amt" class="amount-input" inputmode="decimal" placeholder="0" value="${d.amount? (d.amount/100).toString():''}">
    </label>

    ${d.kind==='transfer' ? `
      <label class="fld"><span class="lbl">From</span><select id="fromId">${accOpts(d.fromId,true)}</select></label>
      <label class="fld"><span class="lbl">To</span><select id="toId">${accOpts(d.toId,true)}</select></label>
    ` : d.kind==='income' ? `
      <label class="fld"><span class="lbl">Into account</span><select id="toId">${accOpts(d.toId)}</select></label>
    ` : `
      <label class="fld"><span class="lbl">Paid from</span><select id="fromId">${accOpts(d.fromId,true)}</select></label>
    `}

    ${favs.length && !editing ? `<div class="lbl">Quick pick</div><div class="chips" style="margin-bottom:12px" id="favChips">
      ${favs.map(c=>`<button class="chip ${d.categoryId===c.id?'on':''}" data-c="${c.id}"><span class="cx">${c.icon}</span>${esc(c.name)}</button>`).join('')}
    </div>`:''}

    <div class="lbl">Category</div>
    <div class="catgrid" id="catGrid">
      ${cats.map(c=>`<button data-c="${c.id}" class="${d.categoryId===c.id?'on':''}"><span class="ce">${c.icon}</span>${esc(c.name)}</button>`).join('')}
    </div>

    <label class="fld" style="margin-top:14px"><span class="lbl">Date</span>
      <input type="date" id="date" value="${d.date}" max="${todayISO()}"></label>
    <label class="fld"><span class="lbl">Note (optional)</span>
      <input id="note" value="${esc(d.note)}" placeholder="what / why"></label>

    <div class="btnrow" style="margin-top:6px">
      <button class="btn primary wide" id="saveTx">${editing?'Save changes':'Add'}</button>
    </div>
    ${editing?`<div class="btnrow" style="margin-top:10px"><button class="btn danger wide" id="delTx">Delete</button></div>`:''}
  `);

  $('#segKind').onclick = e=>{ const btn=e.target.closest('button'); if(!btn) return;
    addDraft.kind = btn.dataset.k; addDraft.categoryId=null;
    if(addDraft.kind==='expense'){ addDraft.fromId = addDraft.fromId || (cache.accounts[0]&&cache.accounts[0].id); addDraft.toId=null; }
    if(addDraft.kind==='income'){ addDraft.toId = addDraft.toId || (cache.accounts[0]&&cache.accounts[0].id); addDraft.fromId=null; }
    if(addDraft.kind==='transfer'){ addDraft.fromId = addDraft.fromId||(cache.accounts[0]&&cache.accounts[0].id); addDraft.toId = addDraft.toId||(cache.accounts[1]&&cache.accounts[1].id); }
    syncDraftFromInputs(); drawAddSheet(editing);
  };
  const pick = id=>{ addDraft.categoryId = id; $$('#catGrid button,#favChips button').forEach(b=>b.classList.toggle('on', b.dataset.c===id)); };
  $('#catGrid').onclick = e=>{ const b=e.target.closest('button'); if(b) pick(b.dataset.c); };
  if($('#favChips')) $('#favChips').onclick = e=>{ const b=e.target.closest('button'); if(b) pick(b.dataset.c); };
  $('#saveTx').onclick = saveTx;
  if($('#delTx')) $('#delTx').onclick = ()=> delTx(editing);
}
function syncDraftFromInputs(){
  if($('#amt')) addDraft.amount = parseAmount($('#amt').value);
  if($('#fromId')) addDraft.fromId = $('#fromId').value;
  if($('#toId')) addDraft.toId = $('#toId').value;
  if($('#date')) addDraft.date = $('#date').value || todayISO();
  if($('#note')) addDraft.note = $('#note').value.trim();
}
async function saveTx(){
  syncDraftFromInputs();
  const d = addDraft;
  // normalise endpoints so a stale id from a previous kind can't linger
  if(d.kind==='income'){ d.fromId = null; }
  else if(d.kind==='expense'){ d.toId = null; }
  if(!d.amount || d.amount<=0) return toast('Enter an amount');
  if(!d.categoryId) return toast('Pick a category');
  if(d.kind!=='income' && !d.fromId) return toast('Pick an account');
  if(d.kind==='income' && !d.toId) return toast('Pick an account');
  if(d.kind==='transfer' && d.fromId===d.toId) return toast('From and To must differ');
  await idbPut('transactions', d);
  await reloadCache();
  closeSheet(); render();
  toast('Saved');
}
async function delTx(){
  await idbDel('transactions', addDraft.id);
  const removed = addDraft;
  await reloadCache(); closeSheet(); render();
  toast('Deleted', 'Undo', async ()=>{ await idbPut('transactions', removed); await reloadCache(); render(); });
}

    <label class="fld"><span class="lbl">Type</span><select id="at">
      ${['bank','cash','wallet'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></label>

    <button class="btn primary wide" id="sv">${e?'Save':'Add'}</button>
    ${e?`<div class="btnrow" style="margin-top:10px"><button class="btn danger wide" id="dl">Delete account</button></div>

function sparkline(vals, w=220, ht=40){
  if(vals.length<2) return '';
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(ht-(v-mn)/rng*ht).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" width="100%" height="${ht}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

let holdingDraft = null;
function openHoldingSheet(h){
  const editing = !!(h && h.id && cache.holdings.some(x=>x.id===h.id));
  holdingDraft = h ? JSON.parse(JSON.stringify(h)) : {id:uid(), label:'', assetTypeId:(cache.assetTypes[0]||{}).id, quantity:'', investedValue:0, currentValue:0, attributes:{}, buyDate:todayISO(), note:''};
  if(!holdingDraft.attributes) holdingDraft.attributes = {};
  if(!holdingDraft.assetTypeId) holdingDraft.assetTypeId = holdingType(holdingDraft).id;
  drawHoldingSheet(editing);
}
function readHoldingForm(){
  const d = holdingDraft;
  if($('#hl')) d.label = $('#hl').value.trim();
  if($('#hq')) d.quantity = $('#hq').value.trim();
  if($('#hi')) d.investedValue = parseAmount($('#hi').value);
  if($('#hc')) d._curInput = $('#hc').value;
  if($('#hn')) d.note = $('#hn').value.trim();
  $$('[data-attr]').forEach(inp=>{ d.attributes[inp.dataset.attr] = inp.value.trim(); });
}

  openSheet(`
    <h2>${editing?'Edit holding':'Add holding'}</h2>

      ${cache.assetTypes.map(t=>`<option value="${t.id}" ${d.assetTypeId===t.id?'selected':''}>${t.icon||''} ${esc(t.name)}</option>`).join('')}
      <option value="__new">＋ New type…</option></select></label>
    <label class="fld"><span class="lbl">Label</span><input id="hl" value="${esc(d.label)}" placeholder="e.g. HDFC Bank shares"></label>
    <label class="fld"><span class="lbl">Quantity${type.quantityUnit?' ('+esc(type.quantityUnit)+')':' (optional)'}</span><input id="hq" value="${esc(d.quantity)}" placeholder="e.g. 50"></label>
    <label class="fld"><span class="lbl">Invested / cost value (₹)</span><input id="hi" inputmode="decimal" value="${d.investedValue? (d.investedValue/100):''}" placeholder="0"></label>
    <label class="fld"><span class="lbl">Current value (₹)</span><input id="hc" inputmode="decimal" value="${curInput}" placeholder="0"></label>
    ${(type.fields||[]).map(f=>`<label class="fld"><span class="lbl">${esc(f.label)}</span>
      <input data-attr="${esc(f.key)}" type="${f.kind==='date'?'date':f.kind==='number'?'number':'text'}" value="${esc(d.attributes[f.key]||'')}"></label>`).join('')}
    <label class="fld"><span class="lbl">Note</span><input id="hn" value="${esc(d.note||'')}"></label>
    <button class="btn primary wide" id="sv">${editing?'Save':'Add'}</button>
    <p class="hintline">Current value feeds Net Worth. Saving a new current value records a dated point.</p>
    ${editing?`
      ${hist.length>1?`<div class="section-label" style="margin:14px 0 4px">Value history</div>
      <div class="card tight">${sparkline(hist.map(v=>v.value))}
        <div class="bars-x"><span>${fmtDay(hist[0].date)}</span><span>${money(hist[hist.length-1].value)}</span></div></div>`:''}
      <div class="divider"></div>
      <div class="section-label" style="margin:0 0 6px">Buy more / sell</div>
      <div class="btnrow">
        <input id="bsQty" placeholder="qty" style="max-width:80px">
        <input id="bsAmt" inputmode="decimal" placeholder="₹ amount" style="flex:1">
        <select id="bsAcc" style="max-width:110px">${accOpts}</select>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" id="buyBtn">Buy more</button>
        <button class="btn sm" id="sellBtn">Sell</button>
        <button class="btn sm danger" id="dl" style="margin-left:auto">Delete</button>
      </div>
    `:''}
  `);
  $('#ht').onchange = ()=>{
    readHoldingForm();
    if($('#ht').value==='__new'){
      openAssetTypeSheet(null, t=>{ holdingDraft.assetTypeId = t.id; drawHoldingSheet(editing); });
      return;
    }
    holdingDraft.assetTypeId = $('#ht').value;
    holdingDraft.attributes = {}; // fields differ per type
    drawHoldingSheet(editing);
  };
  const h = d;
  const commit = async (writeValuation)=>{
    readHoldingForm();
    const t = holdingType(h);
    h.assetTypeId = t.id; h.typeName = t.name; h.icon = t.icon || '📦';
    if(!h.label) h.label = t.name;
    h.investedValue = h.investedValue||0;
    const newCur = parseAmount(h._curInput||'0'); delete h._curInput;
    const changed = newCur !== (h.currentValue||0);
    h.currentValue = newCur;
    await idbPut('holdings', h);
    if(writeValuation && changed && newCur>0) await idbPut('valuations', {id:uid(), holdingId:h.id, date:todayISO(), value:newCur});
  };
  $('#sv').onclick = async ()=>{ await commit(true); await reloadCache(); closeSheet(); render(); toast('Saved'); };
  if(editing){
    $('#buyBtn').onclick = async ()=>{
      const amt=parseAmount($('#bsAmt').value); if(amt<=0) return toast('Enter amount');
      const acc=$('#bsAcc').value;
      await idbPut('transactions', {id:uid(), amount:amt, kind:'transfer', fromId:acc, toId:h.id,
        categoryId:(cache.categories.find(c=>c.class==='saving')||{}).id, date:todayISO(), note:'Buy · '+h.label, tags:['invest'], createdAt:new Date().toISOString()});
      h.investedValue=(h.investedValue||0)+amt; h.currentValue=(h.currentValue||0)+amt;
      const q=parseFloat($('#bsQty').value); if(!isNaN(q)) h.quantity=String((parseFloat(h.quantity)||0)+q);
      await idbPut('holdings',h); await reloadCache(); closeSheet(); render(); toast('Bought');
    };
    $('#sellBtn').onclick = async ()=>{
      const amt=parseAmount($('#bsAmt').value); if(amt<=0) return toast('Enter proceeds');
      const acc=$('#bsAcc').value;
      const frac = h.currentValue? Math.min(1, amt/h.currentValue) : 1;
      const costOut = Math.round((h.investedValue||0)*frac);
      await idbPut('transactions', {id:uid(), amount:amt, kind:'transfer', fromId:h.id, toId:acc,
        categoryId:(cache.categories.find(c=>c.class==='saving')||{}).id, date:todayISO(),
        note:'Sell · '+h.label+' (realised '+moneyR(amt-costOut)+')', tags:['invest'], createdAt:new Date().toISOString()});
      h.investedValue=Math.max(0,(h.investedValue||0)-costOut); h.currentValue=Math.max(0,(h.currentValue||0)-amt);
      const q=parseFloat($('#bsQty').value); if(!isNaN(q)) h.quantity=String(Math.max(0,(parseFloat(h.quantity)||0)-q));
      await idbPut('holdings',h);
      if(h.currentValue<=0 && h.investedValue<=0) await idbDel('holdings',h.id);
      await reloadCache(); closeSheet(); render(); toast('Sold');
    };
    $('#dl').onclick = async ()=>{
      await idbDel('holdings', h.id);
      for(const v of cache.valuations.filter(v=>v.holdingId===h.id)) await idbDel('valuations', v.id);
      await reloadCache(); closeSheet(); render(); toast('Deleted');
    };
  }
}

/* ---- asset types (user-editable) ---- */
let typeDraft = null;
function openAssetTypeSheet(t, after){
  const editing = !!(t && t.id);
  typeDraft = t ? JSON.parse(JSON.stringify(t)) : {id:uid(), name:'', quantityUnit:'', icon:'📦', fields:[], builtIn:false, order:cache.assetTypes.length};
  if(!typeDraft.fields) typeDraft.fields = [];
  drawAssetTypeSheet(editing, after);
}
function readTypeForm(){
  const d = typeDraft;
  if($('#tyName')) d.name = $('#tyName').value.trim();
  if($('#tyUnit')) d.quantityUnit = $('#tyUnit').value.trim();
  if($('#tyIcon')) d.icon = $('#tyIcon').value.trim() || '📦';
  $$('[data-fl]').forEach(inp=>{ const i=+inp.dataset.fl; d.fields[i] = d.fields[i]||{}; d.fields[i].label = inp.value; });
  $$('[data-fk]').forEach(sel=>{ const i=+sel.dataset.fk; d.fields[i] = d.fields[i]||{}; d.fields[i].kind = sel.value; });
}
function drawAssetTypeSheet(editing, after){
  const d = typeDraft;
  openSheet(`
    <h2>${editing?'Edit asset type':'New asset type'}</h2>
    <div class="btnrow">
      <label class="fld" style="flex:2"><span class="lbl">Name</span><input id="tyName" value="${esc(d.name)}" placeholder="e.g. PPF"></label>
      <label class="fld" style="flex:1"><span class="lbl">Icon</span><input id="tyIcon" value="${esc(d.icon)}" maxlength="2"></label>
    </div>
    <label class="fld"><span class="lbl">Quantity unit (optional)</span><input id="tyUnit" value="${esc(d.quantityUnit)}" placeholder="e.g. shares, g, sqft"></label>
    <div class="section-label" style="margin:6px 0">Extra fields</div>
    <div id="flds">
      ${d.fields.map((f,i)=>`<div class="btnrow" style="margin-bottom:8px">
        <input data-fl="${i}" value="${esc(f.label||'')}" placeholder="Field label" style="flex:2">
        <select data-fk="${i}" style="flex:1">
          ${['text','number','date'].map(k=>`<option ${f.kind===k?'selected':''}>${k}</option>`).join('')}
        </select>
        <button class="btn sm danger" data-flx="${i}">✕</button>
      </div>`).join('')}
    </div>
    <button class="btn sm" id="addFld">＋ Add field</button>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn primary wide" id="tySave">${editing?'Save':'Add type'}</button>
    </div>
    ${editing && !d.builtIn?`<div class="btnrow" style="margin-top:10px"><button class="btn danger wide" id="tyDel">Delete type</button></div>`:''}
    ${d.builtIn?`<p class="hintline">Built-in type — you can rename it and change its fields, but not delete it.</p>`:''}
  `);
  $('#addFld').onclick = ()=>{ readTypeForm(); typeDraft.fields.push({key:'f'+Date.now().toString(36), label:'', kind:'text'}); drawAssetTypeSheet(editing, after); };
  $$('[data-flx]').forEach(b=> b.onclick = ()=>{ readTypeForm(); typeDraft.fields.splice(+b.dataset.flx,1); drawAssetTypeSheet(editing, after); });
  $('#tySave').onclick = async ()=>{
    readTypeForm();
    if(!d.name) return toast('Name the type');
    d.fields = d.fields.filter(f=>f.label && f.label.trim()).map(f=>({key:f.key||('f'+Math.random().toString(36).slice(2,7)), label:f.label.trim(), kind:f.kind||'text'}));
    await idbPut('assetTypes', d);
    await reloadCache();

    toast('Saved');
  };

    if(cache.holdings.some(h=>h.assetTypeId===d.id)) return toast('In use by a holding');

  }

function openCardPay(card, st){
  const accOpts = cache.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}">${esc(a.name)} · ${money(accountBalance(a.id))}</option>`).join('');
  const remain = st.totalDue - (st.amountPaid||0);
  openSheet(`
    <h2>Pay ${esc(card.name)}</h2>
    <div class="view-sub">Statement ${money(st.totalDue)} · already paid ${moneyR(st.amountPaid||0)} · remaining ${money(remain)}</div>
    <label class="fld"><span class="lbl">Pay from</span><select id="pf">${accOpts}</select></label>
    <label class="fld"><span class="lbl">Amount ₹</span><input id="pa" class="amount-input" inputmode="decimal" value="${remain>0?(remain/100):''}"></label>
    <div class="chips" style="margin-bottom:12px">
      <button class="chip" data-set="${remain}">Remaining</button>
      <button class="chip" data-set="${st.totalDue}">Full bill</button>
      <button class="chip" data-set="${st.minDue}">Minimum</button>
    </div>
    <button class="btn primary wide" id="doPay">Pay</button>
  `);
  $$('[data-set]').forEach(b=> b.onclick = ()=> $('#pa').value = (+b.dataset.set/100));
  $('#doPay').onclick = async ()=>{
    const amt = parseAmount($('#pa').value); if(amt<=0) return toast('Enter amount');
    const cat = cache.categories.find(x=>x.name==='Credit card payment') || cache.categories.find(x=>x.kind==='transfer');
    await idbPut('transactions', { id:uid(), amount:amt, kind:'transfer', fromId:$('#pf').value, toId:card.id,
      categoryId: cat && cat.id, date:todayISO(), note:'Bill payment · '+card.name, tags:[], createdAt:new Date().toISOString() });
    st.amountPaid = (st.amountPaid||0) + amt;
    st.status = st.amountPaid >= st.totalDue ? 'paid' : 'partial';
    await idbPut('cardStatements', st);
    await reloadCache(); closeSheet(); render(); toast('Payment recorded');
  };
}

    await idbPut('goals', g); await reloadCache(); closeSheet(); render(); toast('Saved');
  };
  if(e){
    $('#contrib').onclick = async ()=>{
      const amt = parseAmount($('#addAmt').value); if(amt<=0) return toast('Enter amount');
      g.savedAmount = (g.savedAmount||0) + amt; await idbPut('goals', g);
      await reloadCache(); closeSheet(); render(); toast('Added to '+g.name);
    };
    $('#dl').onclick = async ()=>{ await idbDel('goals', g.id); await reloadCache(); closeSheet(); render(); toast('Deleted'); };
  }
}

/* ============================================================
   6d. Sheets — Recurring
   ============================================================ */
function openRecurringManager(){
  openSheet(`
    <h2>Recurring & routines</h2>
    <p class="hintline">Auto-post fires silently on the due date. Otherwise it waits as a &ldquo;Due now&rdquo; card on Home.</p>
    <div class="card tight" style="margin:12px 0">
      ${cache.recurring.length? cache.recurring.slice().sort((a,b)=>(a.nextDueDate||'').localeCompare(b.nextDueDate||'')).map(r=>`
        <div class="row tappable" data-rec="${r.id}">
          <div class="ic">${r.autoPost?'⚙️':'🔔'}</div>
          <div class="rmain"><div class="rtitle">${esc(r.name)}</div>
            <div class="rsub">${moneyR(r.amount)} · ${r.frequency} · next ${fmtDay(r.nextDueDate)} · ${r.autoPost?'auto':'manual'}</div></div>
        </div>`).join('') : '<div class="empty">Nothing recurring yet</div>'}
      <div class="row"><button class="btn ghost" id="addRec">+ Add recurring item</button></div>
    </div>
  `);
  $('#addRec').onclick = ()=> openRecurringSheet();
  $$('[data-rec]').forEach(r=> r.onclick = ()=> openRecurringSheet(cache.recurring.find(x=>x.id===r.dataset.rec)));
}
function openRecurringSheet(r){
  const e = r && r.id;
  r = Object.assign({id:uid(), name:'', kind:'expense', amount:0, isAmountFixed:true, categoryId:null,
    fromId:(cache.accounts[0]||{}).id||null, toId:null, frequency:'monthly', dayOfMonth:1,
    nextDueDate:todayISO(), autoPost:false}, r||{});
  const accOpts = (sel,withCards)=>{
    let o = `<option value="">—</option>` + cache.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
    if(withCards) o += cache.creditCards.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} (card)</option>`).join('');
    return o;
  };
  const catOpts = cache.categories.filter(c=> r.kind==='transfer'?c.kind==='transfer':c.kind===r.kind)
    .map(c=>`<option value="${c.id}" ${r.categoryId===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  openSheet(`
    <h2>${e?'Edit recurring':'Add recurring'}</h2>
    <label class="fld"><span class="lbl">Name</span><input id="rn" value="${esc(r.name)}" placeholder="e.g. House rent"></label>
    <label class="fld"><span class="lbl">Type</span><select id="rk">
      ${['expense','income','transfer'].map(k=>`<option ${r.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>
    <label class="fld"><span class="lbl">Amount (₹)</span><input id="ra" inputmode="decimal" value="${r.amount?(r.amount/100):''}"></label>
    <label class="fld"><span class="lbl">Category</span><select id="rc">${catOpts}</select></label>
    ${r.kind!=='income'?`<label class="fld"><span class="lbl">From</span><select id="rf">${accOpts(r.fromId,true)}</select></label>`:''}
    ${r.kind!=='expense'?`<label class="fld"><span class="lbl">To</span><select id="rt">${accOpts(r.toId,r.kind==='transfer')}</select></label>`:''}
    <div class="btnrow">
      <label class="fld" style="flex:1"><span class="lbl">Frequency</span><select id="rfr">
        <option ${r.frequency==='monthly'?'selected':''}>monthly</option><option ${r.frequency==='weekly'?'selected':''}>weekly</option></select></label>
      <label class="fld" style="flex:1"><span class="lbl">Next due</span><input type="date" id="rd" value="${r.nextDueDate}"></label>
    </div>
    <label class="fld"><span class="lbl" style="display:flex;justify-content:space-between">Auto-post on due date
      <input type="checkbox" id="rap" ${r.autoPost?'checked':''} style="width:auto"></span></label>
    <button class="btn primary wide" id="sv">${e?'Save':'Add'}</button>
    ${e?`<div class="btnrow" style="margin-top:10px"><button class="btn danger wide" id="dl">Delete</button></div>`:''}
  `);
  $('#rk').onchange = ()=>{ r.kind = $('#rk').value; r.categoryId=null; openRecurringSheet(r); };
  $('#sv').onclick = async ()=>{
    r.name = $('#rn').value.trim() || 'Recurring';
    r.kind = $('#rk').value;
    r.amount = parseAmount($('#ra').value);
    r.categoryId = $('#rc').value || null;
    r.fromId = $('#rf') ? ($('#rf').value||null) : null;
    r.toId = $('#rt') ? ($('#rt').value||null) : null;
    r.frequency = $('#rfr').value;
    r.nextDueDate = $('#rd').value || todayISO();
    r.autoPost = $('#rap').checked;
    if(r.amount<=0) return toast('Enter an amount');
    await idbPut('recurring', r);
    await processRecurring();
    await reloadCache(); closeSheet(); render(); toast('Saved');
  };
  if(e) $('#dl').onclick = async ()=>{ await idbDel('recurring', r.id); await reloadCache(); closeSheet(); render(); toast('Deleted'); };
}

/* ============================================================
   7. Settings sheet
   ============================================================ */
const THEMES = [['day','Day'],['sepia','Sepia'],['dark','Dark'],['night','Night']];
function applyTheme(t){
  if(t==='day') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('leofin-theme', t); }catch(e){}
  const meta = { day:'#1f7a54', sepia:'#1f7a54', dark:'#58b48d', night:'#c7a86a' }[t] || '#1f7a54';
  $('meta[name=theme-color]').setAttribute('content', meta);
}
function openSettings(){
  openSheet(`
    <h2>Settings</h2>
    <label class="fld"><span class="lbl">Reading theme</span>
      <div class="seg" id="thSeg">${THEMES.map(([v,n])=>`<button data-t="${v}" class="${settings.theme===v?'on':''}">${n}</button>`).join('')}</div>
    </label>
    <label class="fld"><span class="lbl">Month starts on day</span>
      <select id="msd">${Array.from({length:28},(_,i)=>i+1).map(d=>`<option ${settings.monthStartDay===d?'selected':''}>${d}</option>`).join('')}</select>
    </label>
    <div class="divider"></div>
    <div class="section-label" style="margin:0 0 8px">Backup</div>
    <div class="btnrow">
      <button class="btn" id="expBtn">⬇ Export JSON</button>
      <button class="btn" id="impBtn">⬆ Import JSON</button>
    </div>
    <input type="file" id="impFile" accept="application/json" hidden>
    <p class="hintline">Export regularly — data lives only on this device. Import replaces everything.</p>
    <div class="divider"></div>
    <div class="section-label" style="margin:0 0 8px">Manage</div>
    <div class="btnrow">
      <button class="btn sm" id="mgRec">Recurring & routines</button>
      <button class="btn sm" id="mgCats">Categories & budgets</button>
      <button class="btn sm" id="mgTypes">Asset types</button>
      <button class="btn sm danger" id="wipeBtn">Erase all data</button>
    </div>
    <p class="hintline">Leo Finance · single user · INR · offline. Full spec implemented.</p>
  `);
  $('#thSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
    $$('#thSeg button').forEach(x=>x.classList.toggle('on',x===b));
    applyTheme(b.dataset.t); saveSettings({theme:b.dataset.t});
  };
  $('#msd').onchange = ()=>{ saveSettings({monthStartDay:+$('#msd').value}).then(()=>{ render(); }); };
  $('#expBtn').onclick = exportJSON;
  $('#impBtn').onclick = ()=> $('#impFile').click();
  $('#impFile').onchange = importJSON;
  $('#mgRec').onclick = openRecurringManager;
  $('#mgCats').onclick = openCategoryManager;
  $('#mgTypes').onclick = openAssetTypeManager;
  $('#wipeBtn').onclick = wipeAll;
}

async function exportJSON(){
  const dump = { app:'leo-finance', version:1, exportedAt:new Date().toISOString(), settings };
  for(const s of STORES) dump[s] = cache[s];
  const blob = new Blob([JSON.stringify(dump,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `leo-finance-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Exported');
}
async function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(data.app!=='leo-finance') return toast('Not a Leo Finance file');
    if(!confirm('Replace ALL current data with this file?')) return;
    for(const s of [...STORES]){
      for(const row of cache[s]) await idbDel(s, row.id);
      for(const row of (data[s]||[])) await idbPut(s, row);
    }
    if(data.settings) await metaPut('settings', data.settings);
    await metaPut('seeded', true);
    await reloadCache();
    await seedAssetTypesIfEmpty(); await reloadCache();
    applyTheme(settings.theme||'day');
    closeSheet(); render(); toast('Imported');
  }catch(err){ toast('Import failed — bad file'); }
  finally{ e.target.value=''; }
}
async function wipeAll(){
  if(!confirm('Erase everything on this device? Export first if unsure.')) return;
  for(const s of STORES){ for(const row of cache[s]) await idbDel(s,row.id); }
  await metaPut('seeded', false);
  await seedIfNeeded(); await reloadCache(); await seedAssetTypesIfEmpty(); await reloadCache();
  closeSheet(); render(); toast('Data erased');
}

function openCategoryManager(){
  const rows = cache.categories.slice().sort((a,b)=>(a.kind).localeCompare(b.kind)||(a.order||0)-(b.order||0));
  openSheet(`
    <h2>Categories &amp; budgets</h2>
    <div class="inline-add">
      <input id="ncName" placeholder="New category name">
      <select id="ncKind" style="max-width:120px"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option></select>
      <button class="btn sm" id="ncAdd">Add</button>
    </div>
    <div class="card tight" style="margin-top:12px; max-height:52vh; overflow:auto">
      ${rows.map(c=>`<div class="row" style="flex-wrap:wrap">
        <div class="ic" style="background:${c.color}22">${c.icon}</div>
        <div class="rmain tappable" data-editc="${c.id}" style="cursor:pointer"><div class="rtitle">${esc(c.name)}</div>
          <div class="rsub">${c.kind} · ${c.class}${c.isRoutine?' · routine':''}${c.isFavourite?' · ★':''}</div></div>
        <button class="btn sm" data-favc="${c.id}">${c.isFavourite?'★':'☆'}</button>
        <button class="btn sm" data-rtc="${c.id}">${c.isRoutine?'R':'r'}</button>
        <button class="btn sm danger" data-delc="${c.id}">✕</button>
        ${c.kind==='expense'?`<div style="flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:6px">
          <span class="lbl" style="margin:0">Budget/mo ₹</span>
          <input data-budc="${c.id}" inputmode="decimal" value="${c.monthlyBudget?(c.monthlyBudget/100):''}" placeholder="0" style="max-width:120px;padding:6px 8px">
        </div>`:''}
      </div>`).join('')}
    </div>
    <p class="hintline">Tap a name to rename / recolour. ★ = quick-pick on Add. R = routine checklist.</p>
  `);
  $('#ncAdd').onclick = async ()=>{
    const name = $('#ncName').value.trim(); if(!name) return;
    await idbPut('categories', {id:uid(), name, kind:$('#ncKind').value, class:'na', isRoutine:false, isFavourite:false, icon:'•', color:'#8b938d', order:99, monthlyBudget:0});
    await reloadCache(); openCategoryManager();
  };
  $$('[data-editc]').forEach(el=> el.onclick = ()=> openCategorySheet(catById(el.dataset.editc)));
  $$('[data-favc]').forEach(b=> b.onclick = async ()=>{ const c=catById(b.dataset.favc); c.isFavourite=!c.isFavourite; await idbPut('categories',c); await reloadCache(); openCategoryManager(); });
  $$('[data-rtc]').forEach(b=> b.onclick = async ()=>{ const c=catById(b.dataset.rtc); c.isRoutine=!c.isRoutine; await idbPut('categories',c); await reloadCache(); openCategoryManager(); });
  $$('[data-budc]').forEach(inp=> inp.onchange = async ()=>{ const c=catById(inp.dataset.budc); c.monthlyBudget=parseAmount(inp.value); await idbPut('categories',c); await reloadCache(); toast('Budget set'); });
  $$('[data-delc]').forEach(b=> b.onclick = async ()=>{
    if(cache.transactions.some(t=>t.categoryId===b.dataset.delc)) return toast('In use — cannot delete');
    await idbDel('categories', b.dataset.delc); await reloadCache(); openCategoryManager();
  });
}
const CAT_COLORS = ['#1f7a54','#2f6b8a','#3f4fa0','#5a3f8f','#7a3f8f','#b04a7a','#a3384c','#b0472e','#b07d1f','#7a5230','#5a7a2f','#2f8a8a','#45526e','#5a635e','#8b938d'];
function openCategorySheet(c){
  if(!c) return;
  openSheet(`
    <h2>Edit category</h2>
    <div class="btnrow">
      <label class="fld" style="flex:2"><span class="lbl">Name</span><input id="ceName" value="${esc(c.name)}"></label>
      <label class="fld" style="flex:1"><span class="lbl">Icon</span><input id="ceIcon" value="${esc(c.icon)}" maxlength="2"></label>
    </div>
    <label class="fld"><span class="lbl">Class (for the Needs / Wants / Savings split)</span><select id="ceClass">
      ${['need','want','saving','debt','na'].map(k=>`<option ${c.class===k?'selected':''}>${k}</option>`).join('')}</select></label>
    <div class="lbl">Colour</div>
    <div class="chips" id="ceColors" style="margin-bottom:14px">
      ${CAT_COLORS.map(col=>`<button class="chip" data-col="${col}" style="border-color:${col};${c.color===col?`background:${col};color:#fff`:''}"><span style="width:12px;height:12px;border-radius:3px;background:${col};display:inline-block"></span></button>`).join('')}
    </div>
    <button class="btn primary wide" id="ceSave">Save</button>
  `);
  let color = c.color;
  $('#ceColors').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; color=b.dataset.col;
    $$('#ceColors button').forEach(x=>{ const on=x.dataset.col===color; x.style.background=on?color:''; x.style.color=on?'#fff':''; }); };
  $('#ceSave').onclick = async ()=>{
    c.name = $('#ceName').value.trim() || c.name;
    c.icon = $('#ceIcon').value.trim() || c.icon;
    c.class = $('#ceClass').value;
    c.color = color;
    await idbPut('categories', c); await reloadCache(); closeSheet(); openCategoryManager(); toast('Saved');
  };
}

/* ============================================================
   8. Boot + navigation
   ============================================================ */
$('#tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  if(btn.dataset.tab==='add'){ openAddSheet(); return; }
  currentTab = btn.dataset.tab;
  render();
  window.scrollTo(0,0);
});
$('#btnSettings').addEventListener('click', openSettings);

(async function boot(){
  try{
    await openDB();
    await seedIfNeeded();
    await reloadCache();
    await seedAssetTypesIfEmpty();
    await processRecurring();
    applyTheme(settings.theme || localStorage.getItem('leofin-theme') || 'day');
    render();
  }catch(err){
    view.innerHTML = `<div class="card"><h3>Could not start</h3><p class="view-sub">${esc(err.message||err)}</p>
      <p>This app needs IndexedDB. If you're in a private window, try a normal one.</p></div>`;
  }
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){}
  }
})();
</script>
